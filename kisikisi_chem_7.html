<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVIEW MID 1-Chemistry Grade 7</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --subtext-color: #475569;
      --border-color: #bae6fd;
      --correct-color: #15803d;
      --correct-bg: #dcfce7;
      --incorrect-color: #b91c1c;
      --incorrect-bg: #fee2e2;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .quiz-container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.12);
      padding: 30px;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary-color);
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      letter-spacing: 0.5px;
    }

    .teacher-badge {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary-dark);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
    }

    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary-color);
      transition: width 0.3s ease;
    }

    .question-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .question-text {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      color: var(--text-color);
    }

    .option-btn:hover:not([disabled]) {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-color) !important;
      color: var(--correct-color);
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-color) !important;
      color: var(--incorrect-color);
    }

    .option-btn[disabled] {
      cursor: default;
    }

    .score-board {
      text-align: center;
      padding: 25px;
      background: var(--primary-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }

    .restart-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background-color: var(--primary-dark);
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <header>
    <h1>REVIEW MID 1-Chemistry Grade 7</h1>
    <div class="teacher-badge">Teacher: Ms. Theres</div>
  </header>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="quiz-body"></div>

  <div class="score-board" id="score-board">
    <h2>Review Completed!</h2>
    <p id="score-text" style="font-size: 1.2rem;"></p>
    <button class="restart-btn" onclick="initQuiz()">Try Again (Shuffle Questions)</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      q: "Tom is holding a hard wooden block in his hand. His teacher explains that the block is a solid, and it is made of billions of tiny particles that are trapped in a neat, tight pattern. Which statement correctly describes the particles inside Tom's solid block?",
      options: [
        "They are close together and vibrate about fixed positions.",
        "They are far apart and move freely.",
        "They are close together and move randomly throughout the container.",
        "They have no kinetic energy."
      ],
      answer: "They are close together and vibrate about fixed positions."
    },
    {
      q: "Which property is shared by both liquids and gases?",
      options: [
        "They can flow.",
        "They have a fixed shape.",
        "They have a fixed volume.",
        "They cannot be compressed."
      ],
      answer: "They can flow."
    },
    {
      q: "A gas can be compressed more easily than a liquid because the particles in a gas...",
      options: [
        "have large spaces between them.",
        "are smaller.",
        "move more slowly.",
        "have stronger forces of attraction."
      ],
      answer: "have large spaces between them."
    },
    {
      q: "A solid is heated until it becomes a liquid. What happens to its particles?",
      options: [
        "They gain kinetic energy and can move past one another.",
        "They stop moving.",
        "They become closer together and stop vibrating.",
        "They lose kinetic energy and become fixed."
      ],
      answer: "They gain kinetic energy and can move past one another."
    },
    {
      q: "Which change of state occurs when a gas changes directly into a solid?",
      options: [
        "Deposition",
        "Melting",
        "Condensation",
        "Freezing"
      ],
      answer: "Deposition"
    },
    {
      q: "Sam heats a cup of water. Soon, bubbles form and the water turns into gas. What is this process called?",
      options: [
        "Boiling",
        "Melting",
        "Freezing",
        "Cooling"
      ],
      answer: "Boiling"
    },
    {
      q: "Which process occurs when a liquid changes into a gas at the surface of the liquid?",
      options: [
        "Evaporation",
        "Boiling",
        "Condensation",
        "Freezing"
      ],
      answer: "Evaporation"
    },
    {
      q: "Siti spills a small puddle of water on her desk. After an hour, she touches the desk and notices the spot feels much cooler than the rest of the room. Her teacher explains that the liquid water changed into an invisible gas and carried the heat away into the air. What is the name of this phase change that caused the cooling?",
      options: [
        "Evaporation",
        "Freezing",
        "Melting",
        "Condensation"
      ],
      answer: "Evaporation"
    },
    {
      q: "Water boils at 100°C at normal atmospheric pressure. If a substance has a boiling point of 80°C, what is its state at 90°C?",
      options: [
        "Gas",
        "Solid",
        "Liquid",
        "Plasma"
      ],
      answer: "Gas"
    },
    {
      q: "A gas is heated while its pressure remains constant. What happens to its volume?",
      options: [
        "It increases.",
        "It decreases.",
        "It remains unchanged.",
        "It becomes zero."
      ],
      answer: "It increases."
    },
    {
      q: "Mia warms up a solid block of chocolate in a pot. As the chocolate gets hotter, its temperature rises quickly. Inside the chocolate, the tiny particles are vibrating faster and faster. What type of energy is increasing inside the chocolate while the temperature goes up?",
      options: [
        "Kinetic",
        "Potential",
        "Chemical",
        "Light"
      ],
      answer: "Kinetic"
    },
    {
      q: "Which gas would be expected to diffuse the fastest?",
      options: [
        "Hydrogen",
        "Oxygen",
        "Carbon dioxide",
        "Chlorine"
      ],
      answer: "Hydrogen"
    },
    {
      q: "Which statement best defines an element?",
      options: [
        "A pure substance that cannot be broken down into simpler substances by chemical processes.",
        "A substance made from two or more elements chemically combined.",
        "A substance that can be separated by filtration.",
        "A combination of different substances that are not chemically combined."
      ],
      answer: "A pure substance that cannot be broken down into simpler substances by chemical processes."
    },
    {
      q: "Leo is playing a science game on his computer. The game asks him to find a pure substance made of only one single type of atom. He looks at a list of items to see which one cannot be broken down into anything simpler. Which of the following is an element?",
      options: [
        "Oxygen",
        "Water",
        "Carbon dioxide",
        "Sodium chloride"
      ],
      answer: "Oxygen"
    },
    {
      q: "Which pair contains only elements?",
      options: [
        "Oxygen and hydrogen",
        "Water and oxygen",
        "Carbon dioxide and nitrogen",
        "Sodium chloride and hydrogen"
      ],
      answer: "Oxygen and hydrogen"
    },
    {
      q: "What is a compound?",
      options: [
        "Two or more elements chemically combined in fixed proportions.",
        "Two or more substances physically mixed together.",
        "A substance containing only one type of atom.",
        "A substance that can always be separated by filtration."
      ],
      answer: "Two or more elements chemically combined in fixed proportions."
    },
    {
      q: "What does the formula H₂O tell us about one molecule of water?",
      options: [
        "It contains two hydrogen atoms and one oxygen atom.",
        "It contains one hydrogen atom and two oxygen atoms.",
        "It contains two hydrogen molecules and one oxygen molecule.",
        "It contains two elements and two atoms."
      ],
      answer: "It contains two hydrogen atoms and one oxygen atom."
    },
    {
      q: "Which statement correctly compares a compound with a mixture?",
      options: [
        "The substances in a mixture are not chemically combined.",
        "Both always contain elements in fixed proportions.",
        "A compound can be separated by physical methods, but a mixture cannot.",
        "A mixture always has completely different properties from its components."
      ],
      answer: "The substances in a mixture are not chemically combined."
    },
    {
      q: "Which of the following is a mixture?",
      options: [
        "Air",
        "Oxygen",
        "Carbon dioxide",
        "Water"
      ],
      answer: "Air"
    },
    {
      q: "A student has a mixture of iron filings and sulfur powder. Which method would be most suitable for separating them?",
      options: [
        "Using a magnet",
        "Filtration",
        "Evaporation",
        "Distillation"
      ],
      answer: "Using a magnet"
    }
  ];

  let currentQuestions = [];
  let answeredCount = 0;
  let score = 0;

  // Fisher-Yates Shuffle Algorithm
  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initQuiz() {
    score = 0;
    answeredCount = 0;
    document.getElementById('score-board').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
    
    // Shuffle question order and options
    currentQuestions = shuffleArray(rawQuestions).map(q => {
      return {
        ...q,
        shuffledOptions: shuffleArray(q.options)
      };
    });

    renderQuiz();
  }

  function renderQuiz() {
    const quizBody = document.getElementById('quiz-body');
    quizBody.innerHTML = '';

    currentQuestions.forEach((q, qIndex) => {
      const card = document.createElement('div');
      card.className = 'question-card';

      const qText = document.createElement('div');
      qText.className = 'question-text';
      qText.innerText = `${qIndex + 1}. ${q.q}`;
      card.appendChild(qText);

      const optionsGrid = document.createElement('div');
      optionsGrid.className = 'options-grid';

      const labels = ['A', 'B', 'C', 'D'];

      q.shuffledOptions.forEach((opt, optIndex) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${labels[optIndex]}. ${opt}`;
        btn.onclick = () => handleSelectOption(qIndex, opt, btn, optionsGrid);
        optionsGrid.appendChild(btn);
      });

      card.appendChild(optionsGrid);
      quizBody.appendChild(card);
    });
  }

  function handleSelectOption(qIndex, selectedOpt, selectedBtn, optionsContainer) {
    const question = currentQuestions[qIndex];
    const buttons = optionsContainer.querySelectorAll('.option-btn');

    // Disable all options for this question after selection
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOpt === question.answer) {
      selectedBtn.classList.add('correct');
      score++;
    } else {
      selectedBtn.classList.add('incorrect');
      // Highlight the correct option
      buttons.forEach(btn => {
        if (btn.innerText.substring(3) === question.answer) {
          btn.classList.add('correct');
        }
      });
    }

    answeredCount++;
    const progressPercent = (answeredCount / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;

    if (answeredCount === currentQuestions.length) {
      showResults();
    }
  }

  function showResults() {
    const scoreBoard = document.getElementById('score-board');
    const scoreText = document.getElementById('score-text');
    const percentage = Math.round((score / currentQuestions.length) * 100);

    scoreText.innerHTML = `You scored <strong>${score}</strong> out of <strong>${currentQuestions.length}</strong> (${percentage}%).`;
    scoreBoard.style.display = 'block';
    
    scoreBoard.scrollIntoView({ behavior: 'smooth' });
  }

  // Initialize on page load
  window.onload = initQuiz;
</script>

</body>
</html>
