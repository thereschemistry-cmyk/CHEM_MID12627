<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVIEW MID 1-Chemistry Grade 8</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --subtext-color: #475569;
      --border-color: #bae6fd;
      --correct-color: #15803d;
      --correct-bg: #dcfce7;
      --incorrect-color: #b91c1c;
      --incorrect-bg: #fee2e2;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .quiz-container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.12);
      padding: 30px;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary-color);
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      letter-spacing: 0.5px;
    }

    .teacher-badge {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary-dark);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
    }

    .student-info {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .student-info label {
      font-weight: 600;
      color: var(--text-color);
    }

    .student-info input {
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .student-info input:focus {
      border-color: var(--primary-color);
    }

    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary-color);
      transition: width 0.3s ease;
    }

    .question-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .question-text {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      color: var(--text-color);
    }

    .option-btn:hover:not([disabled]) {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
    }

    .option-btn.selected {
      background-color: #bae6fd;
      border-color: var(--primary-color);
      font-weight: bold;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-color) !important;
      color: var(--correct-color);
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-color) !important;
      color: var(--incorrect-color);
    }

    .submit-container {
      text-align: center;
      margin-top: 25px;
    }

    .submit-btn, .restart-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover, .restart-btn:hover {
      background-color: var(--primary-dark);
    }

    .score-board {
      text-align: center;
      padding: 25px;
      background: var(--primary-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <header>
    <h1>REVIEW MID 1-Chemistry Grade 8</h1>
    <div class="teacher-badge">Teacher: Ms. Theres</div>
  </header>

  <div class="student-info">
    <label for="student-name">Nama Siswa / Student Name:</label>
    <input type="text" id="student-name" placeholder="Masukkan nama lengkap..." required>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="quiz-body"></div>

  <div class="submit-container" id="submit-container">
    <button class="submit-btn" onclick="submitQuiz()">Submit Answers</button>
  </div>

  <div class="score-board" id="score-board">
    <h2>Review Completed!</h2>
    <p id="student-display" style="font-size: 1.1rem; font-weight: 600;"></p>
    <p id="score-text" style="font-size: 1.2rem;"></p>
    <button class="restart-btn" onclick="initQuiz()">Try Again (Shuffle Questions)</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      q: "The ion produced by acids when they dissolve in water is...",
      options: ["H⁺", "OH⁻", "Na⁺", "Cl⁻"],
      answer: "H⁺"
    },
    {
      q: "Imagine a scale that measures how strong a liquid is. On one side are sour acids, and on the other side are bitter bases. Right in the middle, there is a peaceful balance that is completely safe and plain, like pure water. What number shows this perfect, neutral spot?",
      options: ["7", "3", "9", "12"],
      answer: "7"
    },
    {
      q: "Which equation represents the reaction between an acid and a reactive metal?",
      options: [
        "metal + acid → salt + hydrogen",
        "metal + acid → salt + oxygen",
        "metal + acid → water + carbon dioxide",
        "metal + acid → metal hydroxide + hydrogen"
      ],
      answer: "metal + acid → salt + hydrogen"
    },
    {
      q: "Which substance is an alkali?",
      options: ["Sodium hydroxide", "Copper(II) oxide", "Zinc oxide", "Copper(II) carbonate"],
      answer: "Sodium hydroxide"
    },
    {
      q: "When a liquid acid dissolves a powdery carbonate, a sudden fizzing releases a hidden vapor into the air. Which gas is set free by this chemical reaction?",
      options: ["Carbon dioxide", "Hydrogen", "Oxygen", "Nitrogen"],
      answer: "Carbon dioxide"
    },
    {
      q: "Which reaction produces a salt and water?",
      options: ["Acid + alkali", "Acid + metal", "Metal + water", "Salt + metal"],
      answer: "Acid + alkali"
    },
    {
      q: "A student places blue litmus paper into a solution. The paper turns red. What can be concluded?",
      options: ["The solution is acidic.", "The solution is alkaline.", "The solution is neutral.", "The solution is a salt."],
      answer: "The solution is acidic."
    },
    {
      q: "Two mysterious liquids sit on a science laboratory shelf. The first liquid has a pH score of 4, while the second liquid holds a pH score of 6. If we measure the sour power of these two fluids, which statement tells the truth?",
      options: [
        "The pH 4 solution is more acidic.",
        "The pH 6 solution is more acidic.",
        "Both solutions are neutral.",
        "Both solutions have the same acidity."
      ],
      answer: "The pH 4 solution is more acidic."
    },
    {
      q: "Which word equation is correct?",
      options: [
        "acid + carbonate → salt + water + carbon dioxide",
        "acid + carbonate → salt + hydrogen",
        "acid + carbonate → salt + oxygen",
        "acid + carbonate → water + hydrogen"
      ],
      answer: "acid + carbonate → salt + water + carbon dioxide"
    },
    {
      q: "Which salt is soluble in water?",
      options: ["Copper(II) sulfate", "Copper(II) carbonate", "Copper(II) oxide", "Calcium carbonate"],
      answer: "Copper(II) sulfate"
    },
    {
      q: "Which statement correctly describes an exothermic reaction?",
      options: [
        "It transfers thermal energy to the surroundings.",
        "It absorbs thermal energy from the surroundings.",
        "It always causes the temperature to decrease.",
        "It has a positive enthalpy change."
      ],
      answer: "It transfers thermal energy to the surroundings."
    },
    {
      q: "Which reaction acts like a sponge and absorbs heat from its surroundings?",
      options: [
        "Thermal decomposition of calcium carbonate",
        "Combustion of wood",
        "Respiration",
        "Neutralisation of an acid and an alkali"
      ],
      answer: "Thermal decomposition of calcium carbonate"
    },
    {
      q: "Dissolving ammonium chloride in water causes the temperature to fall from 28°C to 22°C. What does this show?",
      options: [
        "Thermal energy is absorbed.",
        "Thermal energy is released.",
        "The process is exothermic.",
        "The process has a negative ΔH."
      ],
      answer: "Thermal energy is absorbed."
    },
    {
      q: "The enthalpy change of a reaction is defined as:",
      options: [
        "The difference in energy content between products and reactants",
        "The temperature of the reactants",
        "The energy required to start a reaction only",
        "The total mass of the products"
      ],
      answer: "The difference in energy content between products and reactants"
    },
    {
      q: "What does the activation energy represent?",
      options: [
        "The minimum energy needed for a reaction to start.",
        "The total energy released by a reaction.",
        "The energy stored only in the products.",
        "The energy difference between reactants and products."
      ],
      answer: "The minimum energy needed for a reaction to start."
    },
    {
      q: "A reaction has an enthalpy change of +85 kJ. Which statement is correct?",
      options: [
        "The reaction is endothermic and absorbs 85 kJ.",
        "The reaction is exothermic and releases 85 kJ.",
        "The reaction is exothermic and absorbs 85 kJ.",
        "The reaction is neutral and releases 85 kJ."
      ],
      answer: "The reaction is endothermic and absorbs 85 kJ."
    },
    {
      q: "Which statement about bond breaking is correct?",
      options: [
        "Energy is absorbed.",
        "Energy is released.",
        "No energy change occurs.",
        "Bonds break without any energy input."
      ],
      answer: "Energy is absorbed."
    },
    {
      q: "Methane reacts with steam: CH₄(g) + H₂O(g) → 3H₂(g) + CO(g), ΔH = +314 kJ. Which conclusion is correct?",
      options: [
        "The reaction absorbs 314 kJ of thermal energy.",
        "The reaction releases 314 kJ of thermal energy.",
        "The reaction is exothermic.",
        "The products have less energy than the reactants."
      ],
      answer: "The reaction absorbs 314 kJ of thermal energy."
    },
    {
      q: "Photosynthesis is an endothermic reaction. What happens to energy?",
      options: ["Energy is absorbed.", "Energy is released.", "No energy is involved.", "Energy is destroyed."],
      answer: "Energy is absorbed."
    },
    {
      q: "The bond energy of an H-H bond is 436 kJ/mol. How much energy is needed to break all the H-H bonds in 2H₂ (2H₂ → 4H)?",
      options: ["872 kJ", "436 kJ", "654 kJ", "1,744 kJ"],
      answer: "872 kJ"
    },
    {
      q: "What is the definition of a neutralisation reaction?",
      options: [
        "A chemical reaction between an acid and a base/alkali producing a salt and water.",
        "A process where thermal energy is absorbed from surroundings.",
        "A reaction between a metal and oxygen forming metal oxide.",
        "A process of separating insoluble solid from liquid."
      ],
      answer: "A chemical reaction between an acid and a base/alkali producing a salt and water."
    },
    {
      q: "Which equation correctly represents a neutralisation reaction example?",
      options: [
        "HCl + NaOH → NaCl + H₂O",
        "Zn + 2HCl → ZnCl₂ + H₂",
        "CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂",
        "CH₄ + 2O₂ → CO₂ + 2H₂O"
      ],
      answer: "HCl + NaOH → NaCl + H₂O"
    },
    {
      q: "Which statement correctly contrasts exothermic and endothermic reactions?",
      options: [
        "Exothermic releases heat (temp rises), while endothermic absorbs heat (temp falls).",
        "Exothermic absorbs heat (temp falls), while endothermic releases heat (temp rises).",
        "Exothermic reactions always have a positive ΔH, while endothermic have a negative ΔH.",
        "Exothermic reactions break bonds, while endothermic reactions form bonds without energy."
      ],
      answer: "Exothermic releases heat (temp rises), while endothermic absorbs heat (temp falls)."
    },
    {
      q: "Which statement regarding air purification in a spacecraft is FALSE?",
      options: [
        "Sodium chloride reacts with carbon dioxide and removes it from the spacecraft's air.",
        "Sodium hydroxide can be used to remove carbon dioxide inside a spacecraft.",
        "Astronauts produce carbon dioxide during respiration.",
        "Removing carbon dioxide is important because high concentrations are dangerous to astronauts."
      ],
      answer: "Sodium chloride reacts with carbon dioxide and removes it from the spacecraft's air."
    },
    {
      q: "Why is removing carbon dioxide essential in a spacecraft environment?",
      options: [
        "High concentrations of carbon dioxide are toxic and dangerous to astronauts.",
        "Carbon dioxide turns the air into flammable methane gas.",
        "Carbon dioxide reacts with oxygen to destroy water supplies.",
        "Carbon dioxide increases air pressure to explosive levels."
      ],
      answer: "High concentrations of carbon dioxide are toxic and dangerous to astronauts."
    },
    {
      q: "A student mixes two chemicals in a test tube. The temperature increases from 25°C to 38°C. Is the reaction exothermic or endothermic?",
      options: [
        "Exothermic, because thermal energy is released causing a temperature rise.",
        "Endothermic, because thermal energy is absorbed causing a temperature rise.",
        "Exothermic, because thermal energy is absorbed from surroundings.",
        "Endothermic, because the system loses mass."
      ],
      answer: "Exothermic, because thermal energy is released causing a temperature rise."
    },
    {
      q: "In an exothermic reaction where the temperature rises from 25°C to 38°C, what happens to energy in the surroundings?",
      options: [
        "Energy is transferred to the surroundings, causing the surrounding temperature to rise.",
        "Energy is taken away from surroundings, causing surroundings to feel cold.",
        "No energy is transferred to the surroundings.",
        "Energy is converted directly into mass."
      ],
      answer: "Energy is transferred to the surroundings, causing the surrounding temperature to rise."
    },
    {
      q: "For 2H₂ + O₂ → 2H₂O, given bond energies: H-H = 436 kJ/mol and O=O = 496 kJ/mol. Calculate total energy needed to break reactants' bonds.",
      options: ["1,368 kJ", "932 kJ", "1,852 kJ", "496 kJ"],
      answer: "1,368 kJ"
    },
    {
      q: "For 2H₂ + O₂ → 2H₂O, given O-H bond energy = 463 kJ/mol. Calculate total energy released when forming 2 molecules of water (4 O-H bonds).",
      options: ["1,852 kJ", "926 kJ", "1,368 kJ", "463 kJ"],
      answer: "1,852 kJ"
    },
    {
      q: "Based on total bond breaking energy (1,368 kJ) and bond forming energy (1,852 kJ) for 2H₂ + O₂ → 2H₂O, is the overall reaction exothermic or endothermic?",
      options: [
        "Exothermic, because more energy is released forming bonds than absorbed breaking bonds.",
        "Endothermic, because more energy is absorbed breaking bonds than released forming bonds.",
        "Endothermic, because ΔH is positive.",
        "Neutral, because energy absorbed equals energy released."
      ],
      answer: "Exothermic, because more energy is released forming bonds than absorbed breaking bonds."
    }
  ];

  let currentQuestions = [];
  let userAnswers = {};

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initQuiz() {
    userAnswers = {};
    document.getElementById('student-name').value = '';
    document.getElementById('student-name').disabled = false;
    document.getElementById('score-board').style.display = 'none';
    document.getElementById('submit-container').style.display = 'block';
    document.getElementById('progress-bar').style.width = '0%';
    
    currentQuestions = shuffleArray(rawQuestions).map(q => {
      return {
        ...q,
        shuffledOptions: shuffleArray(q.options)
      };
    });

    renderQuiz();
  }

  function renderQuiz() {
    const quizBody = document.getElementById('quiz-body');
    quizBody.innerHTML = '';

    currentQuestions.forEach((q, qIndex) => {
      const card = document.createElement('div');
      card.className = 'question-card';

      const qText = document.createElement('div');
      qText.className = 'question-text';
      qText.innerText = `${qIndex + 1}. ${q.q}`;
      card.appendChild(qText);

      const optionsGrid = document.createElement('div');
      optionsGrid.className = 'options-grid';

      const labels = ['A', 'B', 'C', 'D'];

      q.shuffledOptions.forEach((opt, optIndex) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${labels[optIndex]}. ${opt}`;
        btn.onclick = () => selectOption(qIndex, opt, btn, optionsGrid);
        optionsGrid.appendChild(btn);
      });

      card.appendChild(optionsGrid);
      quizBody.appendChild(card);
    });
  }

  function selectOption(qIndex, selectedOpt, btn, optionsContainer) {
    userAnswers[qIndex] = selectedOpt;

    const buttons = optionsContainer.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    const answeredCount = Object.keys(userAnswers).length;
    const progressPercent = (answeredCount / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
  }

  function submitQuiz() {
    const studentName = document.getElementById('student-name').value.trim();

    if (!studentName) {
      alert('Harap isi nama lengkap sebelum menekan tombol submit.');
      document.getElementById('student-name').focus();
      return;
    }

    const answeredCount = Object.keys(userAnswers).length;
    if (answeredCount < currentQuestions.length) {
      if (!confirm(`Kamu baru menjawab ${answeredCount} dari ${currentQuestions.length} soal. Yakin ingin mengumpulkan?`)) {
        return;
      }
    }

    let score = 0;
    const cards = document.querySelectorAll('.question-card');

    currentQuestions.forEach((q, qIndex) => {
      const card = cards[qIndex];
      const buttons = card.querySelectorAll('.option-btn');
      const selected = userAnswers[qIndex];

      buttons.forEach(btn => {
        btn.disabled = true;
        const optionText = btn.innerText.substring(3);

        if (optionText === q.answer) {
          btn.classList.add('correct');
        } else if (optionText === selected) {
          btn.classList.add('incorrect');
        }
      });

      if (selected === q.answer) {
        score++;
      }
    });

    document.getElementById('student-name').disabled = true;
    document.getElementById('submit-container').style.display = 'none';

    const scoreBoard = document.getElementById('score-board');
    const studentDisplay = document.getElementById('student-display');
    const scoreText = document.getElementById('score-text');
    const percentage = Math.round((score / currentQuestions.length) * 100);

    studentDisplay.innerText = `Student: ${studentName}`;
    scoreText.innerHTML = `Skor Kamu: <strong>${score}</strong> / <strong>${currentQuestions.length}</strong> (${percentage}%).`;
    scoreBoard.style.display = 'block';
    
    scoreBoard.scrollIntoView({ behavior: 'smooth' });
  }

  window.onload = initQuiz;
</script>

</body>
</html>
